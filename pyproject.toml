[project]
name = "admin-system"
version = "1.0.0"
description = "CS2 Metamod admin system plugin build tools"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "cmake>=4.3.4",
    "conan>=2.29.1",
    "ninja>=1.13.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "poethepoet>=0.47.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.poe.tasks]
build = "bash scripts/build.sh"
build-linux = "bash scripts/build.sh linux-steamrt-release"
lint = "ruff check ."
deploy-package = "python deploy/tools/cli.py package"
deploy-render = "python deploy/tools/cli.py render"
deploy-server = "python deploy/tools/cli.py deploy"
deploy-cleanup = "python deploy/tools/cli.py cleanup"
deploy-dbs = "python deploy/tools/cli.py ensure-dbs"
deploy-tunnel = "python deploy/tools/cli.py tunnel-db"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vendor", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["vendor", "references"]
