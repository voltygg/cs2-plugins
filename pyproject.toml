[project]
name = "cs2-plugins"
version = "1.0.0"
description = "CS2 Metamod plugin monorepo build tools"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    # Provides the tasks and tool pins below. Replace `main` with a release tag
    # when builds must stop tracking framework changes.
    "voltmod @ git+https://github.com/voltygg/voltmod.git@refactor/api-v2",
    "ruff>=0.14.0",
    "poethepoet>=0.47.0",
    "python-dotenv>=1.2.0",
    "typer>=0.27.1",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.poe.tasks]
build = "voltmod build"
build-linux = "voltmod build linux-steamrt-release"
test = "voltmod test"
bootstrap = "voltmod bootstrap"
doctor = "voltmod doctor"
new-plugin = "voltmod new-plugin"
install = "voltmod install"
start-server = "voltmod serve"
panorama = "voltmod panorama"
format = "voltmod format plugins"
deploy-package = "python -m deploy.tools.cli package"
deploy-render = "python -m deploy.tools.cli render"
deploy-server = "python -m deploy.tools.cli deploy"
deploy-update = "python -m deploy.tools.cli update"
deploy-cleanup = "python -m deploy.tools.cli cleanup"
deploy-dbs = "python -m deploy.tools.cli ensure-dbs"
deploy-tunnel = "python -m deploy.tools.cli tunnel-db"
rcon = "python -m deploy.tools.cli rcon"

[tool.poe.tasks.lint]
help = "Lint the build tooling and check the plugin source conventions"
sequence = [
    { cmd = "ruff check ." },
    { cmd = "voltmod modgraph --plugins ." },
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vendor", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
