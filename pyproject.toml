[project]
name = "cs2-plugins"
version = "1.0.0"
description = "CS2 Metamod plugin monorepo build tools"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "cmake>=4.3.4",
    "conan>=2.29.1",
    "ninja>=1.13.0",
    "ruff>=0.14.0",
    "poethepoet>=0.47.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0",
    "clang-format==22.1.5",
]

[tool.uv]
package = false

[tool.poe.env]
# Lets repo scripts `import buildtools` from the vendored kit.
PYTHONPATH = "${POE_ROOT}/vendor/cs2-kit/scripts"

[tool.poe.tasks]
build = "python vendor/cs2-kit/scripts/build.py"
build-linux = "python vendor/cs2-kit/scripts/build.py linux-steamrt-release"
bootstrap = "python vendor/cs2-kit/scripts/bootstrap.py"
new-plugin = "python vendor/cs2-kit/scripts/new_plugin.py"
update-submodules = "python scripts/update_submodules.py"
deploy = "python -m deploy.tools.cli local"
start-server = "python scripts/start_server.py"
lint = "ruff check ."
format = "python vendor/cs2-kit/scripts/format.py plugins vendor/cs2-kit/src vendor/cs2-kit/include vendor/cs2-kit/tests"
format-check = "python vendor/cs2-kit/scripts/format.py --check plugins vendor/cs2-kit/src vendor/cs2-kit/include vendor/cs2-kit/tests"
deploy-package = "python -m deploy.tools.cli package"
deploy-render = "python -m deploy.tools.cli render"
deploy-server = "python -m deploy.tools.cli deploy"
deploy-update = "python -m deploy.tools.cli update"
deploy-cleanup = "python -m deploy.tools.cli cleanup"
deploy-dbs = "python -m deploy.tools.cli ensure-dbs"
deploy-tunnel = "python -m deploy.tools.cli tunnel-db"
rcon = "python -m deploy.tools.cli rcon"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vendor", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
