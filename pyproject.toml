[project]
name = "cs2-plugins"
version = "1.0.0"
description = "CS2 Metamod plugin monorepo build tools"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    # Brings the build tasks below plus the pinned CMake/Conan/Ninja/clang-format.
    # Move to a v* tag when reproducibility matters more than tracking the kit.
    "cs2-kit @ git+https://github.com/voltygg/cs2-kit.git@main",
    "ruff>=0.14.0",
    "poethepoet>=0.47.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.poe.tasks]
build = "cs2kit build"
build-linux = "cs2kit build linux-steamrt-release"
bootstrap = "cs2kit bootstrap"
new-plugin = "cs2kit new-plugin"
deploy = "python -m deploy.tools.cli local"
start-server = "python scripts/start_server.py"
lint = "ruff check ."
format = "cs2kit format plugins"
format-check = "cs2kit format --check plugins"
deploy-package = "python -m deploy.tools.cli package"
deploy-render = "python -m deploy.tools.cli render"
deploy-server = "python -m deploy.tools.cli deploy"
deploy-update = "python -m deploy.tools.cli update"
deploy-cleanup = "python -m deploy.tools.cli cleanup"
deploy-dbs = "python -m deploy.tools.cli ensure-dbs"
deploy-tunnel = "python -m deploy.tools.cli tunnel-db"
rcon = "python -m deploy.tools.cli rcon"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vendor", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
