[project]
name = "cs2-plugins"
version = "1.0.0"
description = "CS2 Metamod plugin monorepo build tools"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "cmake>=4.3.4",
    "conan>=2.29.1",
    "ninja>=1.13.0",
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "poethepoet>=0.47.0",
    "python-dotenv>=1.2.0",
    "pyyaml>=6.0",
    "clang-format==22.1.5",
]

[tool.uv]
package = false

[tool.poe.tasks]
build = "python vendor/cs2-kit/scripts/build.py"
build-linux = "python vendor/cs2-kit/scripts/build.py linux-steamrt-release"
bootstrap = "python vendor/cs2-kit/scripts/bootstrap.py"
new-plugin = "python vendor/cs2-kit/scripts/new_plugin.py"
update-submodules = "python scripts/update_submodules.py"
deploy = "python scripts/deploy.py"
start-server = "python scripts/start-server.py"
lint = "ruff check ."
format = "python vendor/cs2-kit/scripts/format.py plugins vendor/cs2-kit/src vendor/cs2-kit/include vendor/cs2-kit/tests"
format-check = "python vendor/cs2-kit/scripts/format.py --check plugins vendor/cs2-kit/src vendor/cs2-kit/include vendor/cs2-kit/tests"
deploy-package = "python deploy/tools/cli.py package"
deploy-render = "python deploy/tools/cli.py render"
deploy-server = "python deploy/tools/cli.py deploy"
deploy-update = "python deploy/tools/cli.py update"
deploy-cleanup = "python deploy/tools/cli.py cleanup"
deploy-dbs = "python deploy/tools/cli.py ensure-dbs"
deploy-tunnel = "python deploy/tools/cli.py tunnel-db"
rcon = "python deploy/tools/cli.py rcon"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["vendor", "references"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["vendor", "references"]

# scripts/ import buildtools off a sys.path entry added at runtime.
mypy_path = "vendor/cs2-kit/scripts"
