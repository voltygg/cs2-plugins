# CircleCI fallback for the GitHub Actions CI and deploy workflows.
version: 2.1

parameters:
  server:
    type: string
    default: ""
  dry-run:
    type: boolean
    default: false

executors:
  toolchain:
    docker:
      - image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    resource_class: large
    environment:
      CCACHE_DIR: /ccache
  machine-docker:
    machine:
      image: ubuntu-2604:current
    resource_class: large

commands:
  setup-toolchain:
    steps:
      - run:
          name: Set up the Voltmod toolchain
          command: |
            echo 'deb https://repo.steampowered.com/steamrt3/apt sniper_beta main contrib non-free' \
              > /etc/apt/sources.list.d/steamrt-beta.list
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates ccache curl gcc-14-monolithic git ninja-build
            rm -rf /var/lib/apt/lists/*
            curl -LsSf https://astral.sh/uv/install.sh | sh
            "$HOME/.local/bin/uv" venv --python 3.14 "$HOME/.voltmod"
            "$HOME/.local/bin/uv" pip install --python "$HOME/.voltmod/bin/python" --no-cache \
              "voltmod @ git+https://github.com/voltygg/voltmod.git@main"
            echo 'export PATH="$HOME/.voltmod/bin:$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            echo 'export VIRTUAL_ENV="$HOME/.voltmod"' >> "$BASH_ENV"
            export PATH="$HOME/.voltmod/bin:$HOME/.local/bin:$PATH"
            export VIRTUAL_ENV="$HOME/.voltmod"
            conan profile detect --force >/dev/null 2>&1 || true
            conan config install https://github.com/voltygg/voltmod.git -sf conan
  restore-conan:
    steps:
      - restore_cache:
          keys:
            - &conan_key conan-sniper-gcc14-v1-{{ checksum "conan.lock" }}
            - conan-sniper-gcc14-v1-
  save-conan:
    steps:
      - save_cache:
          key: *conan_key
          paths:
            - ~/.conan2
  restore-ccache:
    steps:
      - restore_cache:
          keys:
            - &ccache_key ccache-sniper-gcc14-v1-{{ checksum "conan.lock" }}-{{ .Branch }}-{{ .Revision }}
            - ccache-sniper-gcc14-v1-{{ checksum "conan.lock" }}-{{ .Branch }}-
            - ccache-sniper-gcc14-v1-{{ checksum "conan.lock" }}-
  save-ccache:
    steps:
      - save_cache:
          key: *ccache_key
          paths:
            - /ccache
  build-plugins:
    steps:
      - checkout
      - restore-conan
      - setup-toolchain
      - restore-ccache
      - run:
          name: Build Linux plugins
          command: mkdir -p /ccache && voltmod build linux-steamrt-release
  ghcr-login:
    steps:
      - run:
          name: Login to GHCR
          command: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

jobs:
  build-test:
    executor: toolchain
    steps:
      - build-plugins
      - run:
          name: Test
          command: voltmod test linux-steamrt-release
      - save-conan
      - save-ccache

  lint:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Ruff check (build tooling)
          command: uv run poe lint

  build-package:
    executor: toolchain
    steps:
      - build-plugins
      - run:
          name: Test
          command: voltmod test linux-steamrt-release
      - run:
          name: Package every declared plugin
          command: python3 -m deploy.tools.cli package --all linux
      - save-conan
      - save-ccache
      - persist_to_workspace:
          root: .
          paths:
            - package

  runtime-image:
    executor: machine-docker
    resource_class: medium
    steps:
      - checkout
      - ghcr-login
      - run:
          name: Build + push runtime image
          command: |
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
            RUNTIME_IMAGE=$(python3 -m deploy.tools.cli runtime-image)
            docker buildx create --driver docker-container --use
            docker buildx build \
              --file deploy/Dockerfile \
              --target runtime \
              --push \
              --tag "$RUNTIME_IMAGE" \
              --cache-from "type=registry,ref=ghcr.io/voltygg/cs2-plugins/cs2-server-runtime:buildcache" \
              --cache-to "type=registry,ref=ghcr.io/voltygg/cs2-plugins/cs2-server-runtime:buildcache,mode=max" \
              .

  deploy:
    docker:
      - image: cimg/python:3.14
    resource_class: medium
    environment:
      SSH_KEY_FILE: /home/circleci/.ssh/id_deploy
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install deploy deps
          command: |
            sudo apt-get update -qq && sudo apt-get install -y -qq rsync
            pip install --quiet pyyaml python-dotenv
      - run:
          name: Configure SSH
          command: |
            [ -n "$SSH_KEY_B64" ] || { echo "ERROR: SSH_KEY_B64 is empty (cs2-deploy context)" >&2; exit 1; }
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            echo "$SSH_KEY_B64" | base64 -d > "$SSH_KEY_FILE"
            chmod 600 "$SSH_KEY_FILE"
      - run:
          name: Deploy the active servers
          command: |
            FILTER="<< pipeline.parameters.server >>"
            ARGS=(deploy)
            if [ -n "$FILTER" ]; then ARGS+=(--server "$FILTER"); else ARGS+=(--all); fi
            if [ "<< pipeline.parameters.dry-run >>" = "true" ]; then ARGS+=(--dry-run); fi
            python3 -m deploy.tools.cli "${ARGS[@]}"

workflows:
  ci:
    when:
      not:
        equal: [prod, << pipeline.git.branch >>]
    jobs:
      - build-test
      - lint

  deploy:
    when:
      equal: [prod, << pipeline.git.branch >>]
    jobs:
      - build-package
      - runtime-image:
          context: ghcr
      - deploy:
          context: cs2-deploy
          requires:
            - build-package
            - runtime-image
