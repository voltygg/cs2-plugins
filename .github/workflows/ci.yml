name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded CI runs on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    # Prebuilt toolchain image (no per-run image build / tool install). Publish it
    # first via the "Build toolchain image" workflow. Pin by @sha256:<digest>
    # (`docker buildx imagetools inspect <image>`) for reproducible layer reuse.
    container:
      image: ghcr.io/${{ github.repository }}/cs2-plugin-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # The rest of the ccache settings - the sloppiness flags the kit's PCH needs, the
      # size cap, the base-dir rewrite - are applied by `cs2kit build`, which is where
      # the PCH they compensate for is defined.
      CCACHE_DIR: /ccache
    steps:
      - uses: actions/checkout@v7

      # No Conan cache: deps are baked into the toolchain image (deploy/Dockerfile).
      # Per-run key so saves persist; branch-scoped restore; MAXSIZE bounds the blob.
      # The hashFiles() prefix fingerprints the toolchain, so a compiler/deps change
      # starts a fresh cache lineage instead of poisoning hit rates.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          # Absolute path: `~` differs for actions/cache vs ccache in-container.
          path: /ccache
          key: ccache-linux-${{ hashFiles('deploy/Dockerfile', 'conanfile.py', 'conan.lock') }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ hashFiles('deploy/Dockerfile', 'conanfile.py', 'conan.lock') }}-${{ github.ref_name }}-
            ccache-linux-${{ hashFiles('deploy/Dockerfile', 'conanfile.py', 'conan.lock') }}-

      # Prints ccache statistics either side of the build; a warm rerun of an
      # unchanged tree should show >95% hits.
      - name: Build (configure -> build)
        run: cs2kit build linux-steamrt-release --no-test

      - name: Test
        run: ctest --preset linux-steamrt-release

  lint:
    name: Lint (ruff + clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Ruff check (build tooling)
        run: uv run poe lint

      - name: clang-format check
        run: uv run poe format-check
