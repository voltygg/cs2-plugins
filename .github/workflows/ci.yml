# Secrets to be set in the repository settings:
#   PRIVATE_PLUGINS_PAT: optional personal access token to check out the closed-source plugins.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      PRIVATE_PLUGINS_PAT: ${{ secrets.PRIVATE_PLUGINS_PAT }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the closed-source plugins
        if: env.PRIVATE_PLUGINS_PAT != ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${PRIVATE_PLUGINS_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --checkout plugins/anticheat plugins/stronghold

      # The action owns the Conan and compiler caches.
      - uses: voltygg/voltmod/.github/actions/setup-toolchain@main

      - name: Build (configure -> build)
        run: voltmod build -p linux-steamrt-release

      - name: Test
        run: voltmod test -p linux-steamrt-release

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Ruff check (build tooling)
        run: uv run poe lint-ci
