name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded CI runs on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    # Prebuilt toolchain image (no per-run image build / tool install). Publish it
    # first via the "Build toolchain image" workflow.
    container:
      image: ghcr.io/${{ github.repository }}/cs2-plugin-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # No Conan cache: deps are baked into the toolchain image (deploy/Dockerfile).
      # Per-run key so saves persist; branch-scoped restore; MAXSIZE bounds the blob.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-

      - name: Build + test (configure -> build -> ctest via workflow preset)
        env:
          CCACHE_DIR: ~/.ccache
          # Relative paths + ignore checkout mtimes so a fresh checkout still hits ccache.
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_SLOPPINESS: time_macros,locale,include_file_ctime,include_file_mtime
          CCACHE_MAXSIZE: 500M
        run: python3 scripts/build.py linux-steamrt-release

  lint:
    name: Lint (ruff + clang-format)
    runs-on: ubuntu-latest
    steps:
      # Non-recursive: clang-format needs cs2-kit/src, not the nested SDKs.
      - name: Checkout (cs2-kit only, non-recursive)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Ruff check (build tooling)
        run: uv run poe lint

      - name: clang-format dry-run (plugin + cs2-kit sources)
        run: |
          find plugins vendor/cs2-kit/src \
            -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 uvx clang-format@22.1.5 --dry-run --Werror
