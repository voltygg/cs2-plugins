name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded CI runs on a new push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    # Prebuilt toolchain image (no per-run image build / tool install). Publish it
    # first via the "Build toolchain image" workflow.
    container:
      image: ghcr.io/${{ github.repository }}/cs2-build-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Persist the Conan cache so heavy deps aren't recompiled every run.
      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-linux-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan-linux-

      - name: Build + test (configure -> build -> ctest via workflow preset)
        run: bash scripts/build.sh linux-steamrt-release

  lint:
    name: Lint (ruff + clang-format)
    runs-on: ubuntu-latest
    steps:
      # Non-recursive: clang-format needs cs2-kit/src, not the nested SDKs.
      - name: Checkout (cs2-kit only, non-recursive)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Ruff check (build tooling)
        run: uvx ruff check .

      - name: clang-format dry-run (plugin + cs2-kit sources)
        run: |
          find plugins vendor/cs2-kit/src \
            -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 uvx clang-format@22.1.5 --dry-run --Werror
