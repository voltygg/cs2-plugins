name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + test
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7

      # The action owns the Conan and compiler caches.
      - uses: voltygg/voltmod/.github/actions/setup-toolchain@main
        with:
          voltmod-source: "@action"
          conan-source: "@action"

      - name: Build (configure -> build)
        run: voltmod build linux-steamrt-release

      - name: Test
        run: voltmod test linux-steamrt-release

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Ruff check (build tooling)
        run: uv run poe lint
