# Builds the Linux plugin bundles + runtime image, then renders and deploys each
# server in deploy/inventory.yml over SSH (docker compose up).
# Triggers: push to `prod`, or run manually (optionally scoped to one server / dry-run).
# Each server's GitHub Environment must provide secrets: SSH_KEY and SERVER_ENV.
name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      server:
        description: "Deploy only this server id (blank = all active inventory servers)"
        required: false
        default: ""
      dry_run:
        description: "Preview rsync only; do not run docker compose"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

# Serialize deploys per ref; queue rather than cancel, to never abort one mid-flight.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve inventory
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.inv.outputs.servers }}
      plugins: ${{ steps.inv.outputs.plugins }}
      runtime_image: ${{ steps.image.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml jq
      - id: image
        # Single source of truth: defaults.runtime_image in deploy/inventory.yml.
        run: |
          echo "runtime_image=$(python3 deploy/tools/inventory.py runtime-image)" >> "$GITHUB_OUTPUT"
      - id: inv
        run: |
          SERVERS=$(python3 deploy/tools/inventory.py servers-json)
          PLUGINS=$(python3 deploy/tools/inventory.py plugins-json)
          FILTER='${{ github.event.inputs.server }}'
          if [ -n "$FILTER" ]; then
            SERVERS=$(echo "$SERVERS" | jq -c --arg s "$FILTER" '[.[] | select(.id==$s)]')
          fi
          echo "servers=$SERVERS" >> "$GITHUB_OUTPUT"
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "Servers: $SERVERS"
          echo "Plugins: $PLUGINS"

  build:
    name: Build + package plugins
    needs: prepare
    runs-on: ubuntu-latest
    # Same prebuilt toolchain image + Conan cache as ci.yml, instead of rebuilding
    # the image and cold-compiling deps on every deploy.
    container:
      image: ghcr.io/${{ github.repository }}/build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-linux-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan-linux-

      - name: Build Linux plugins
        run: bash scripts/build.sh linux-steamrt-release

      - name: Package each declared plugin
        run: |
          for plugin in $(python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))" <<< '${{ needs.prepare.outputs.plugins }}'); do
            bash deploy/scripts/package-plugin.sh "$plugin" linux
          done

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: package/
          if-no-files-found: error

  runtime-image:
    name: Build + publish runtime image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Layer cache makes this a near-noop when the runtime stage is unchanged.
      - name: Build + push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: true
          tags: ${{ needs.prepare.outputs.runtime_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runtime-check:
    name: Check plugin runtime deps
    needs: [prepare, build, runtime-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: package

      - name: Pull runtime image
        run: docker pull "${{ needs.prepare.outputs.runtime_image }}"

      - name: Run ldd inside runtime image
        run: |
          docker run --rm -v "$PWD/package:/package:ro" \
            "${{ needs.prepare.outputs.runtime_image }}" \
            bash -lc '
              set -euo pipefail
              for so in /package/*/addons/*/bin/linuxsteamrt64/*.so; do
                echo "==> $so"
                ldd "$so" | tee /tmp/ldd.txt
                if grep -q "not found" /tmp/ldd.txt; then
                  exit 1
                fi
              done
            '

  deploy:
    name: Deploy ${{ matrix.server.id }}
    needs: [prepare, build, runtime-check]
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.servers != '[]' }}
    environment: ${{ matrix.server.environment }}
    concurrency:
      group: deploy-${{ matrix.server.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: package

      - name: Install inventory deps (PyYAML)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ matrix.server.ssh_port }}" "${{ matrix.server.host }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write server env from secret
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: |
          if [ -z "$SERVER_ENV" ]; then
            echo "ERROR: SERVER_ENV secret is empty for environment '${{ matrix.server.environment }}'" >&2
            exit 1
          fi
          dir="deploy/secrets/servers/${{ matrix.server.id }}"
          mkdir -p "$dir"
          printf '%s\n' "$SERVER_ENV" > "$dir/.env"

      - name: Deploy
        env:
          RUNTIME_IMAGE: ${{ needs.prepare.outputs.runtime_image }}
          SSH_OPTS: "-i /home/runner/.ssh/id_deploy -o StrictHostKeyChecking=yes"
        run: |
          ARGS=(--server "${{ matrix.server.id }}")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          bash deploy/scripts/deploy.sh "${ARGS[@]}"
