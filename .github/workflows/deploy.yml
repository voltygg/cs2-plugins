name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      server:
        description: "Deploy only this server id (blank = all active inventory servers)"
        required: false
        default: ""
      dry_run:
        description: "Preview rsync only; do not run docker compose"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve inventory
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.inv.outputs.servers }}
      plugins: ${{ steps.inv.outputs.plugins }}
      runtime_image: ${{ steps.image.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-yaml jq
      - id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "runtime_image=ghcr.io/${repo}/cs2-runtime" >> "$GITHUB_OUTPUT"
      - id: inv
        run: |
          SERVERS=$(python3 deploy/tools/inventory.py servers-json)
          PLUGINS=$(python3 deploy/tools/inventory.py plugins-json)
          FILTER='${{ github.event.inputs.server }}'
          if [ -n "$FILTER" ]; then
            SERVERS=$(echo "$SERVERS" | jq -c --arg s "$FILTER" '[.[] | select(.id==$s)]')
          fi
          echo "servers=$SERVERS" >> "$GITHUB_OUTPUT"
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "Servers: $SERVERS"
          echo "Plugins: $PLUGINS"

  build:
    name: Build + package plugins
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Linux plugins via Docker
        run: docker compose -f deploy/docker-compose.build.yml run --rm --build build

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Package each declared plugin
        run: |
          for plugin in $(echo '${{ needs.prepare.outputs.plugins }}' | jq -r '.[]'); do
            bash deploy/scripts/package-plugin.sh "$plugin" linux
          done

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: package/
          if-no-files-found: error

  runtime-image:
    name: Build + publish runtime image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build runtime image
        run: |
          docker build \
            -f deploy/Dockerfile \
            --target runtime \
            -t "${{ needs.prepare.outputs.runtime_image }}:latest" \
            .

      - name: Push runtime image
        run: |
          docker push "${{ needs.prepare.outputs.runtime_image }}:latest"

  runtime-check:
    name: Check plugin runtime deps
    needs: [prepare, build, runtime-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: package

      - name: Pull runtime image
        run: docker pull "${{ needs.prepare.outputs.runtime_image }}:latest"

      - name: Run ldd inside runtime image
        run: |
          docker run --rm -v "$PWD/package:/package:ro" \
            "${{ needs.prepare.outputs.runtime_image }}:latest" \
            bash -lc '
              set -euo pipefail
              for so in /package/*/addons/*/bin/linuxsteamrt64/*.so; do
                echo "==> $so"
                ldd "$so" | tee /tmp/ldd.txt
                if grep -q "not found" /tmp/ldd.txt; then
                  exit 1
                fi
              done
            '

  deploy:
    name: Deploy ${{ matrix.server.id }}
    needs: [prepare, build, runtime-check]
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.servers != '[]' }}
    environment: ${{ matrix.server.environment }}
    concurrency:
      group: deploy-${{ matrix.server.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: package

      - name: Install deploy tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y age rsync python3-yaml
          SOPS_VERSION=v3.13.1
          sudo curl -sSLo /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo chmod +x /usr/local/bin/sops

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ matrix.server.ssh_port }}" "${{ matrix.server.host }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          RUNTIME_IMAGE: ${{ needs.prepare.outputs.runtime_image }}:latest
          SSH_OPTS: "-i /home/runner/.ssh/id_deploy -o StrictHostKeyChecking=yes"
        run: |
          ARGS=(--server "${{ matrix.server.id }}")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          bash deploy/scripts/deploy.sh "${ARGS[@]}"
