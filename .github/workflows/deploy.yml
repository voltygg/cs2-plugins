name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      server:
        description: "Deploy only this server id (blank = all active inventory servers)"
        required: false
        default: ""
      dry_run:
        description: "Preview rsync only; do not run docker compose"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve deploy inputs
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.resolve.outputs.servers }}
      docker_servers: ${{ steps.resolve.outputs.docker_servers }}
      runtime_image: ${{ steps.resolve.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install inventory deps
        run: pip install pyyaml python-dotenv typer

      - name: Resolve inventory
        id: resolve
        run: |
          FILTER='${{ github.event.inputs.server }}'
          SERVERS=$(python3 -m deploy.tools.cli matrix ${FILTER:+--server "$FILTER"})
          DOCKER_SERVERS=$(python3 -m deploy.tools.cli matrix --kind docker ${FILTER:+--server "$FILTER"})
          RUNTIME_IMAGE=$(python3 -m deploy.tools.cli runtime-image)
          echo "servers=$SERVERS" >> "$GITHUB_OUTPUT"
          echo "docker_servers=$DOCKER_SERVERS" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$RUNTIME_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Servers: $SERVERS"
          echo "Runtime image: $RUNTIME_IMAGE"

  build:
    name: Build + package plugins
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      CCACHE_DIR: /ccache
    steps:
      - uses: actions/checkout@v7

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: conan-sniper-gcc14-v1-${{ hashFiles('conan.lock') }}
          restore-keys: conan-sniper-gcc14-v1-

      - uses: voltygg/voltmod/.github/actions/setup-toolchain@main
        with:
          voltmod-source: "@action"
          conan-source: "@action"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /ccache
          key: ccache-sniper-gcc14-v1-${{ hashFiles('conan.lock') }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-sniper-gcc14-v1-${{ hashFiles('conan.lock') }}-${{ github.ref_name }}-
            ccache-sniper-gcc14-v1-${{ hashFiles('conan.lock') }}-

      - name: Build Linux plugins
        run: voltmod build linux-steamrt-release

      - name: Test
        run: voltmod test linux-steamrt-release

      - name: Package every declared plugin
        run: python3 -m deploy.tools.cli package --all linux

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: package/
          if-no-files-found: error

  runtime-image:
    name: Build + publish server runtime image
    needs: prepare
    if: ${{ needs.prepare.outputs.docker_servers != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: true
          tags: ${{ needs.prepare.outputs.runtime_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.server.id }}
    needs: [prepare, build, runtime-image]
    runs-on: ubuntu-latest
    # A skipped runtime-image job must not skip the deploy.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.runtime-image.result)
      && needs.prepare.outputs.servers != '[]' }}
    environment: ${{ matrix.server.environment }}
    concurrency:
      group: deploy-${{ matrix.server.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: package

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install deploy deps
        run: pip install pyyaml python-dotenv typer

      - name: Install rsync
        if: ${{ matrix.server.kind == 'docker' }}
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        if: ${{ matrix.server.kind == 'docker' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ matrix.server.ssh_port }}" "${{ matrix.server.host }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write server env from secret
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: |
          if [ -z "$SERVER_ENV" ]; then
            echo "ERROR: SERVER_ENV secret is empty for environment '${{ matrix.server.environment }}'" >&2
            exit 1
          fi
          dir="deploy/secrets/servers/${{ matrix.server.id }}"
          mkdir -p "$dir"
          printf '%s\n' "$SERVER_ENV" > "$dir/.env"

      - name: Deploy
        env:
          SSH_KEY_FILE: /home/runner/.ssh/id_deploy
        run: |
          ARGS=(deploy --server "${{ matrix.server.id }}" --runtime-image "${{ needs.prepare.outputs.runtime_image }}")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python3 -m deploy.tools.cli "${ARGS[@]}"
