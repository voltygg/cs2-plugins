name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      server:
        description: "Deploy only this server id (blank = every enabled server)"
        required: false
        default: ""
      dry_run:
        description: "Show what would change without changing servers"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Separate from build so the runtime image builds alongside the plugins.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      servers: ${{ steps.plan.outputs.servers }}
      docker: ${{ steps.plan.outputs.docker }}
      runtime_image: ${{ steps.plan.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Plan
        id: plan
        env:
          SERVER: ${{ inputs.server }}
        run: |
          plan=$(uv run --locked --only-group deploy python -m deploy.tools.cli plan ${SERVER:+--server "$SERVER"})
          echo "$plan" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build + package plugins
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the voltmod release in conan.lock; bump the two together.
      # The action installs uv and owns the Conan and compiler caches.
      - uses: voltygg/voltmod/.github/actions/setup-toolchain@v1.4.6

      - name: Build Linux plugins
        run: voltmod build linux-steamrt-release

      - name: Test
        run: voltmod test linux-steamrt-release

      - name: Package plugins
        run: uv run --locked --only-group deploy python -m deploy.tools.cli package

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: package/
          if-no-files-found: error

  runtime-image:
    name: Build + publish runtime image
    needs: plan
    # A dry run publishes nothing.
    if: needs.plan.outputs.docker == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: deploy/docker
          push: true
          tags: |
            ${{ needs.plan.outputs.runtime_image }}:${{ github.sha }}
            ${{ needs.plan.outputs.runtime_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.server.id }}
    needs: [plan, build, runtime-image]
    # Also runs when the image job was skipped: no Docker host, or a dry run.
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.runtime-image.result != 'failure'
      && needs.plan.outputs.servers != '[]' }}
    runs-on: ubuntu-latest
    # A Docker host's first start downloads the whole game.
    timeout-minutes: 120
    environment: ${{ matrix.server.environment }}
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.plan.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Write secrets
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          ENV_FILE: deploy/secrets/servers/${{ matrix.server.id }}/.env
        run: |
          if [ -z "$SERVER_ENV" ]; then
            echo "ERROR: the ${{ matrix.server.environment }} environment has no SERVER_ENV secret" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$ENV_FILE")"
          printf '%s\n' "$SERVER_ENV" > "$ENV_FILE"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/id_deploy"
            chmod 600 "$RUNNER_TEMP/id_deploy"
          fi

      - name: Deploy
        env:
          SSH_KEY_FILE: ${{ runner.temp }}/id_deploy
          RUNTIME_IMAGE_TAG: ${{ github.sha }}
        run: >-
          uv run --locked --only-group deploy python -m deploy.tools.cli deploy
          --server "${{ matrix.server.id }}" ${{ inputs.dry_run && '--dry-run' || '' }}
