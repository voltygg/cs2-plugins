# Builds Linux plugin bundles + the server runtime image, then renders and deploys
# each active server in deploy/inventory.yml over SSH.
name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      server:
        description: "Deploy only this server id (blank = all active inventory servers)"
        required: false
        default: ""
      dry_run:
        description: "Preview rsync only; do not run docker compose"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve deploy inputs
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.resolve.outputs.servers }}
      plugins: ${{ steps.resolve.outputs.plugins }}
      runtime_image: ${{ steps.resolve.outputs.runtime_image }}
    steps:
      - uses: actions/checkout@v7

      - name: Install inventory deps
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Resolve inventory
        id: resolve
        run: |
          FILTER='${{ github.event.inputs.server }}'
          if [ -n "$FILTER" ]; then
            SERVERS=$(python3 deploy/tools/cli.py matrix --server "$FILTER")
          else
            SERVERS=$(python3 deploy/tools/cli.py matrix)
          fi
          PLUGINS=$(python3 deploy/tools/cli.py plugins)
          RUNTIME_IMAGE=$(python3 deploy/tools/cli.py runtime-image)

          echo "servers=$SERVERS" >> "$GITHUB_OUTPUT"
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$RUNTIME_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Servers: $SERVERS"
          echo "Plugins: $PLUGINS"
          echo "Runtime image: $RUNTIME_IMAGE"

  build:
    name: Build + package plugins
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/cs2-plugin-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          # Absolute path: `~` differs for actions/cache vs ccache in-container.
          path: /ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-

      - name: Build Linux plugins
        env:
          CCACHE_DIR: /ccache
          CCACHE_SLOPPINESS: time_macros,locale,include_file_ctime,include_file_mtime
          CCACHE_MAXSIZE: 500M
        run: |
          # In-container path for base-dir rewriting (github.workspace is host path).
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          python3 scripts/build.py linux-steamrt-release

      - name: Package each declared plugin
        run: |
          for plugin in $(echo '${{ needs.prepare.outputs.plugins }}' | python3 -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
            python3 deploy/tools/cli.py package "$plugin" linux
          done

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: package/
          if-no-files-found: error

  runtime-image:
    name: Build + publish server runtime image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: true
          tags: ${{ needs.prepare.outputs.runtime_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.server.id }}
    needs: [prepare, build, runtime-image]
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.servers != '[]' }}
    environment: ${{ matrix.server.environment }}
    concurrency:
      group: deploy-${{ matrix.server.id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: package

      - name: Install deploy deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml python3-dotenv rsync

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ matrix.server.ssh_port }}" "${{ matrix.server.host }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Write server env from secret
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: |
          if [ -z "$SERVER_ENV" ]; then
            echo "ERROR: SERVER_ENV secret is empty for environment '${{ matrix.server.environment }}'" >&2
            exit 1
          fi
          dir="deploy/secrets/servers/${{ matrix.server.id }}"
          mkdir -p "$dir"
          printf '%s\n' "$SERVER_ENV" > "$dir/.env"

      - name: Deploy
        env:
          SSH_KEY_FILE: /home/runner/.ssh/id_deploy
        run: |
          ARGS=(deploy --server "${{ matrix.server.id }}" --runtime-image "${{ needs.prepare.outputs.runtime_image }}")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python3 deploy/tools/cli.py "${ARGS[@]}"
