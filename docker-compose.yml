services:
  # Build service for compiling the plugin
  build:
    build: .
    volumes:
      - .:/app
      - objdir-cache:/app/objdir
    command: >
      bash -c "
        vendor/hl2sdk-cs2/devtools/bin/protoc
          --proto_path=vendor/hl2sdk-cs2/common
          --proto_path=vendor/hl2sdk-cs2/thirdparty/protobuf-3.21.8/src
          --cpp_out=vendor/hl2sdk-cs2/public
          vendor/hl2sdk-cs2/common/*.proto &&
        vendor/hl2sdk-cs2/devtools/bin/protoc
          --proto_path=vendor/hl2sdk-cs2/common
          --proto_path=vendor/hl2sdk-cs2/game/shared
          --proto_path=vendor/hl2sdk-cs2/thirdparty/protobuf-3.21.8/src
          --cpp_out=vendor/hl2sdk-cs2/game/shared
          vendor/hl2sdk-cs2/game/shared/*.proto &&
        mkdir -p objdir && cd objdir &&
        CC=clang CXX=clang++ python3 ../configure.py &&
        ambuild
      "

  # PostgreSQL database for development
  postgres:
    image: postgres:latest
    container_name: admin-system-db
    environment:
      POSTGRES_DB: cs2_server
      POSTGRES_USER: admin_system
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_system -d cs2_server"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: admin-system-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  objdir-cache:
  postgres-data:
  pgadmin-data:
