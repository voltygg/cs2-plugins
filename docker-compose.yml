services:
  # Build service for compiling the plugin
  build:
    build: .
    volumes:
      - .:/app
      - build-cache:/app/build
    command: bash -c "mkdir -p build && cd build && CC=clang CXX=clang++ python3 ../configure.py && ambuild"

  # PostgreSQL database for development
  postgres:
    image: postgres:18
    container_name: admin-system-db
    environment:
      POSTGRES_DB: cs2_server
      POSTGRES_USER: admin_system
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_system -d cs2_server"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: admin-system-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  build-cache:
  postgres-data:
  pgadmin-data:
