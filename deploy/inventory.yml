# Deploy inventory - the single source of truth for Dockerized CS2 boxes.
#
# Keep non-secret server topology here. Secrets stay in per-server .env files or
# GitHub Environment secrets.

defaults:
  ssh_user: steam
  ssh_port: 22
  cs2_root: /home/steam/cs2
  deploy_root: /home/steam/cs2/deploy
  runtime_image: ghcr.io/m9snoi-net/cs2-plugins/cs2-server-runtime:latest

database:
  # VPS-host Postgres, reached from bridge containers via host-gateway.
  host: host.docker.internal
  port: 5432
  user: cs2_app
  sslMode: prefer

plugins:
  admin-system:
    database: admin_system
  # DB-less plugins: no 'database' key, so rendering skips the DB_* requirements.
  bhop: {}
  anticheat: {}

servers:
  - id: box-a
    host: 207.180.234.215
    environment: prod-box-a
    deploy_root: /home/steam/cs2/deploy
    # default plugins for every instance on this box
    plugins:
      - admin-system
      - bhop
      - anticheat
    instances:
      - { name: main, port: 27015, map: de_dust2, hostname: "CS2 Main" }

# Per-instance plugins: an instance's own `plugins:` replaces the server default.
# servers:
#   - id: box-a
#     host: 203.0.113.10
#     environment: prod-box-a
#     deploy_root: /home/steam/cs2/deploy
#     plugins:
#       - admin-system
#     instances:
#       - { name: main,   port: 27015, map: de_dust2, hostname: "CS2 Main" }
#       - { name: retake, port: 27016, map: de_mirage, hostname: "CS2 Retake", plugins: [admin-system, retake-system] }
