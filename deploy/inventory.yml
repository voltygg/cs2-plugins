# Non-secret Docker host topology. Keep secrets in per-server env files or CI.

defaults:
  ssh_user: steam
  ssh_port: 22
  cs2_root: /home/steam/cs2
  deploy_root: /home/steam/cs2/deploy
  runtime_image: ghcr.io/voltygg/cs2-plugins/cs2-server-runtime:latest

database:
  # Host PostgreSQL as reached from bridge containers.
  host: host.docker.internal
  port: 5432
  user: cs2_app
  sslMode: prefer

plugins:
  admin-system:
    database: admin_system
  # Omitting `database` makes a plugin database-free.
  bhop: {}
  # anticheat: {}  # Enable after the observation rollout.

servers:
  - id: box-a
    host: 207.180.234.215
    environment: prod-box-a
    deploy_root: /home/steam/cs2/deploy
    # Default plugins for this box.
    plugins:
      - admin-system
      - bhop
      # - anticheat
    instances:
      - { name: main, port: 27015, map: de_dust2, hostname: "CS2 Main", insecure: true }
      # `insecure: true` launches with -insecure (VAC off) for cheat testing;
      # clients must connect with -insecure too. Leave off for live play.
      # - { name: test, port: 27016, map: de_dust2, hostname: "CS2 Test", insecure: true }

# An instance-level `plugins` list replaces the server default.
