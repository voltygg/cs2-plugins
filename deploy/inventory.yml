# Deploy inventory - the single source of truth for Dockerized CS2 boxes.
#
# The active `servers:` list is intentionally empty in git. Add real servers with
# real hosts/environments in your private branch or deployment commit; keep sample
# values in comments only so CI never deploys placeholders by accident.

defaults:
  ssh_user: steam
  ssh_port: 22
  deploy_root: /home/steam/deploy/cs2
  runtime_image: ghcr.io/m9snoi-net/cs2-plugins/runtime:latest

database:
  # VPS-host Postgres, reached from bridge containers via host-gateway.
  host: host.docker.internal
  port: 5432
  user: cs2_app
  sslMode: prefer

plugins:
  admin-system:
    database: admin_system

servers:
  - id: box-a
    host: 207.180.234.215
    environment: prod-box-a
    deploy_root: /home/steam/deploy/cs2
    runtime_image: ghcr.io/m9snoi-net/cs2-plugins/runtime:latest
    plugins:
      - admin-system
    instances:
      - { name: main,   port: 27015, map: de_dust2, hostname: "CS2 Main" }


