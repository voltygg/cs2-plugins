# SOPS encryption rules for deploy secrets.
#
# Generate an age key pair ONCE:
#     age-keygen -o age.key                 # prints the public key (age1...)
# Put the PUBLIC key below. Keep the PRIVATE key only:
#   - in CI as the per-Environment secret SOPS_AGE_KEY
#   - on operator machines at ~/.config/sops/age/keys.txt
# NEVER commit the private key.
#
# Encrypt a server's env after editing the plaintext copy:
#     sops -e deploy/config/servers/box-a/.env > deploy/config/servers/box-a/.sops.env
#     rm deploy/config/servers/box-a/.env
# Edit later in place with:  sops deploy/config/servers/box-a/.sops.env

creation_rules:
  - path_regex: deploy/config/servers/.*/\.sops\.env$
    # Replace with your real public age recipient (you can list several, comma-separated).
    age: age1REPLACE_WITH_YOUR_PUBLIC_AGE_KEY
